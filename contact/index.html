<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shoko Maeda</title>
	<meta name="description" content="前田翔子のポートフォリオサイトです。">
	<link rel="stylesheet" href="/css/reset.css">
	<link rel="icon" href="/img/favicon.ico?ver=20240720" id="favicon">
	<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-180x180.png?ver=20240720">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
	<link rel="stylesheet" href="/css/common.css">
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
	<link rel="stylesheet" href="../css/contact.css?ver=20240716">
</head>

<body>
	<div class="pageLoader js-screen-transition"></div>

<script>
	window.addEventListener("DOMContentLoaded", async () => {

		const jsScreen = '.js-screen-transition';

		gsap.set(
			jsScreen, {
				x: 0,
			},
		);

		const tl = gsap.timeline();
		tl.to(jsScreen, {
				x: '-100%',
				duration: .5,
		})
	});
</script>
	<header class="header">
		<div class="header__inner">
			<a href="../" class="header-logo">
				<p class="header__logo">SHOKO MAEDA</p>
			</a>
	
			<button id="gnavBtn" class="gnavBtn">
				<span></span>
				<span></span>
			</button>
		</div>
	</header>

	<main class="main">
		<section class="contact section">
			<div class="contact-inner inner">
				<h1 class="contact-heading c-heading">CONTACT</h1>

				<p class="contact-text">ご興味を持っていただき誠にありがとうございます。<br>
						お仕事のご相談、ご依頼、ご質問など、お気軽にお問い合わせください。
				</p>

				<form class="contactForm" action="http://localhost:8888/contact/confirm">
					<dl>
						<dt>お名前</dt>
						<dd>
							<input type="text">
						</dd>

						<dt>ふりがな</dt>
						<dd>
							<input type="text">
						</dd>

						<dt>電話番号</dt>
						<dd>
							<input type="tel">
						</dd>

						<dt>メールアドレス</dt>
						<dd>
							<input type="email">
						</dd>

						<dt>お問い合わせ内容</dt>
						<dd>
							<textarea></textarea>
						</dd>
					</dl>

					<div class="c-buttonWrap">
						<button class="c-button" type="submit">SUBMIT</button>
					</div>
				</form>
			</div>
		</section>
	</main>
	

	
	<footer class="footer">
		<p class="copyright">&copy;Shoko Maeda 2024</p>
	</footer>
	


	<nav class="gnav">
		<ul class="gnav__list">
			<li class="gnav__item"><a href="../">HOME</a></li>
			<li class="gnav__item"><a href="../about">ABOUT</a></li>
			<li class="gnav__item"><a href="../works">WORKS</a></li>
			<!-- <li class="gnav__item"><a href="../contact/">CONTACT</a></li> -->
		</ul>
	</nav>
	
	<script>
		const body = document.querySelector("body");
		const gnav = document.querySelector(".gnav");
		const gnavItem = document.querySelector(".gnav__item");
		const gnavBtn = document.querySelector(".gnavBtn");
	
		// ========================================
		// gnav 開閉時のアニメーション
		// ========================================
		window.addEventListener("DOMContentLoaded", async () => {
			gsap.set(".gnav__item", {
				xPercent: 100,
				opacity: 0
			})
		})
	
	
		gnavBtn.addEventListener('click', function() {
			const result = gnav.classList.contains('is-open');
	
			if (result) {
				// 閉じる
				body.classList.remove('is-fixed');
				gnavBtn.classList.remove('is-active');
				gnav.classList.remove('is-open');
	
				const tl = gsap.timeline();
	
				tl.to(gnav, {
					autoAlpha: 0,
					duration: .5,
					ease: "power2.inOut"
				})
				.to(".gnav__item", {
					opacity: 0,
					xPercent: 100,
					duration: .5,
					ease: "power4.out",
				})
	
			} else {
				// 開く
				body.classList.add('is-fixed');
				gnavBtn.classList.add('is-active');
				gnav.classList.add('is-open');
	
				const tl = gsap.timeline();
	
				tl.to(gnav, {
					autoAlpha: 1,
					duration: 0.5,
					ease: "power2.inOut"
				})
				.to(".gnav__item", {
					opacity: 1,
					xPercent: 0,
					duration: 1,
					ease: "power4.out",
					stagger: {
						each: .1,
					},
				})
			}
		});
	
	
		// ========================================
		// gnav テキストホバーアニメーション
		// ========================================
	
		/* spanタグに分割 */
		let splitTarget = document.querySelectorAll('.gnav__list li a'); //ターゲットとなる要素を全取得
		splitTarget.forEach((target) => { // target = ターゲット
			if (!target.classList.contains('is-active')) { //ターゲットが'is-active'クラスを持っていない場合
				newText = ''; //生成する要素を格納するための変数
				spanText = target.innerHTML; //ターゲットの中身を取得
				spanText.split('').forEach((char) => { // char = character 文字
					newText += '<span>' + char + '</span>'; //一文字ずつspanタグで囲む
				});
				newTextBefore = "<div class='before'>" + newText + "</div>"; //beforeクラスをつけた要素を生成
				newTextAfter = "<div class='after'>" + newText + "</div>"; //afterクラスをつけた要素を生成
				newText = "<span class='text-wrap'>" + newTextBefore + newTextAfter + "</span>"; //before after両要素を囲む要素生成
				target.innerHTML = newText; //ターゲットに生成した要素を挿入
			}
		});
	
		/* ターゲットにホバーした時の動き */
		splitTarget.forEach((target) => {
			if (!target.classList.contains('is-active')) { //ターゲットが'is-active'クラスを持っていない場合
				let beforeSpan = target.querySelector('.before').querySelectorAll('span'); //beforeの中にあるspanタグを全取得
				let afterSpan = target.querySelector('.after').querySelectorAll('span'); //afterの中にあるspanタグを全取得
				target.addEventListener('mouseenter', () => { //ホバーしたとき
					gsap.to(beforeSpan, {
						y: '-100%',
						stagger: .03,
						ease: "power2.out"
					}) //0.03秒おきに各spanタグをy軸上に移動
					gsap.to(afterSpan, {
						y: '0%',
						stagger: .03,
						ease: "power2.out"
					})
				})
				target.addEventListener('mouseleave', () => { //ホバーが外れたとき
					gsap.to(beforeSpan, {
						y: '0%',
						stagger: .03,
						ease: "power2.out"
					})
					gsap.to(afterSpan, {
						y: '100%',
						stagger: .03,
						ease: "power2.out"
					})
				})
			}
		});
	</script>	

	<script>
		// use a script tag or an external JS file
		document.addEventListener("DOMContentLoaded", (event) => {
			gsap.registerPlugin(ScrollTrigger)
			gsap.fromTo(
				'.works__item',
				{
					autoAlpha:0,
					y:10,
				},
				{
					autoAlpha:1,
					duration:.5,
					y:0,
					ease: "power4.in",
					stagger:{
						each:.1,
						from:'start'
					},
				}
			)
		});
	</script>
</body>

</html>
