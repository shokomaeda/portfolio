<div class="loader js-loader">
	<span class="loader__top js-loaderTop"></span>
	<span class="loader__line js-loaderLine"></span>
	<p class="loader__text js-loaderText">SHOKO MAEDA</p>
	<span class="loader__bottom js-loaderBottom"></span>
</div>

<script>
	window.addEventListener("DOMContentLoaded", async () => {

		const jsLoader = '.js-loader';
		const jsLoaderLine = '.js-loaderLine';
		const jsLoaderTop = '.js-loaderTop';
		const jsLoaderBottom = '.js-loaderBottom';
		const jsLoaderText = '.js-loaderText';

		const tl = gsap.timeline();
		tl.to(jsLoaderText, {
			opacity: 1,
			duration: .5,
		})
		tl.to(jsLoaderText, {
			opacity: 0,
			duration: .5,
		}, '+=.5')
		tl.to(jsLoaderLine, {
				scaleX: 1,
				duration: .8,
		}, '<')
		tl.to(jsLoaderLine, {
				autoAlpha: 0,
				duration: .3,
		})
		tl.to(jsLoaderTop, {
				y: '-100%',
				duration: .4,
		})
		tl.to(jsLoaderBottom, {
				y: '100%',
				duration: .4,
		}, '<')
		tl.to(jsLoader, {
				autoAlpha: 0,
				duration: 0,
		}, '+=.4')
	});
</script>
